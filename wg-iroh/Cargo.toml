[package]
name = "wg-iroh"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "An iroh endpoint whose traffic all goes through a userspace WireGuard tunnel"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# iroh main: pkarr follows the endpoint's proxy_url since #4595, not yet released.
iroh = { git = "https://github.com/n0-computer/iroh", branch = "main" }
n0-error = "1"
n0-future = "0.3"
netwatch = { git = "https://github.com/n0-computer/net-tools", branch = "rklaehn/custom-udp" }
nym-smol-core = "1.21.6"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wg-udp = { path = "../wg-udp" }

